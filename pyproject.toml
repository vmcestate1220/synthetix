[project]
name = "synthetix"
version = "0.2.0"
description = "GS2 catalytic-domain variant-effect scoring and structural audit pipeline."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "Christopher Cocchiaraley" }]

# Core scoring pipeline. The docking-prep track (PDBFixer, OpenMM, RDKit,
# Meeko) is kept as an optional extra because those packages carry heavy
# native dependencies and aren't needed just to regenerate the CSV.
dependencies = [
    "biopython>=1.83,<2",
    "pandas>=2.1,<3",
    "seaborn>=0.13,<1",
    "matplotlib>=3.8,<4",
    "requests>=2.31,<3",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
structure = [
    "pdbfixer>=1.9",
    "openmm>=8.1,<9",
    "rdkit-pypi>=2022.9",
    "meeko>=0.5,<1",
]
viz3d = [
    "vpython>=7.6,<8",
]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "predict_efficiency",
    "generate_heatmap",
    "generate_mutants",
    "validate_against_kinetics",
    "align_to_gs2",
    "derive_docking_box",
    "docking_replicates",
    "visualize_flux",
    "synthetix_ligand_prep",
    "synthetix_receptor_prep",
    "synthetix_pdbqt_conv",
    "veron_baseline_audit",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
